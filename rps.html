<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="rps.css">
    <title>rock paper scissors</title>
</head>
<body>
    <div id="container">
        <h1>welcome to my rock paper scissors</h1>
        <h3>Player 1</h3>
        <div class="options">
            <div id="Prock">
                <img src="download.jpeg" alt="">
            </div>
            <div id="Pscissors">
                <img src="download (1).jpeg" alt="">
            </div>
            <div id="Ppaper">
                <img src="paper.jpg" alt="">
            </div>
        </div>
    </div>
    <h2>VS</h2>
    <h3>Robot</h3>
    <div class="options">
            <div id="Brock">
                <img src="download.jpeg" alt="">
            </div>
            <div id="Bscissors">
                <img src="download (1).jpeg" alt="">
            </div>
            <div id="Bpaper">
                <img src="paper.jpg" alt="">
            </div>
        </div>

        <h1>Your score: <span id="PResults">0</span> Bot score: <span id="BResults">0</span></h1>

        <script src="rps.js"></script>
</body>
</html>
